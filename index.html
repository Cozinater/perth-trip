<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perth & Margaret River road trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EC; --ink:#12324A; --muted:#4F6472; --line:#C9D3CF;
  --ocean:#CFE0E8; --land:#E3E6DA; --gum:#5E7F68; --sun:#D9952B; --panel:#F7F8F5;
  --head:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Newsreader", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E29; --ink:#E6EEF0; --muted:#9DB0BA; --line:#2A3F4D;
    --ocean:#16303F; --land:#22323A; --gum:#8DB297; --sun:#E8A94A; --panel:#152632;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E29; --ink:#E6EEF0; --muted:#9DB0BA; --line:#2A3F4D;
  --ocean:#16303F; --land:#22323A; --gum:#8DB297; --sun:#E8A94A; --panel:#152632;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.125rem;line-height:1.55}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:4px}

.page{max-width:1400px;margin:0 auto;padding:0 1.25rem 3rem}
.top{padding:1.5rem 0 .75rem}
.top h1{margin:0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding:.6rem 1.25rem;margin:0 -1.25rem;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font-family:var(--head);font-size:.95rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:.4rem .9rem;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:1.25rem;padding-top:1rem}
.mapcol,.panel{min-width:0}
.mapcol .mapframe{height:45vh;min-height:260px}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1.5fr) minmax(360px,460px);gap:2.5rem;align-items:start;padding-top:1.25rem}
  .mapcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.25rem);height:calc(100vh - 10.5rem);display:flex;flex-direction:column}
  .mapcol .mapframe{flex:1;height:auto;min-height:0}
}
.panel .flights{margin-bottom:1.5rem}
[hidden]{display:none !important}
#days.single .day{border-top:0;padding-top:0}
h1{font-family:var(--head);font-weight:800;font-size:clamp(2rem,5vw,3.4rem);line-height:1;letter-spacing:-.02em;margin:0 0 .75rem}
.lede{color:var(--muted);margin:0 0 1.25rem;max-width:34ch}
.flights{display:grid;gap:.75rem;margin:0 0 1rem}
.flight{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem .8rem}
.leg{font-family:var(--head);font-size:.9rem;color:var(--muted);margin:0 0 .5rem}
.leg b{color:var(--gum);font-weight:700;margin-right:.35rem}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.75rem}
.end{display:flex;flex-direction:column;line-height:1.15}
.end.r{text-align:right}
.code{font-family:var(--head);font-weight:800;font-size:1.9rem;letter-spacing:-.01em}
.tm{font-family:var(--head);font-weight:500;font-size:1rem;font-variant-numeric:tabular-nums}
.tm.tbc{color:var(--muted);font-weight:400}
.ap{font-size:.85rem;color:var(--muted)}
.path{display:flex;flex-direction:column;align-items:center;gap:.15rem;font-family:var(--head);font-size:.78rem;color:var(--muted);min-width:0}
.rule{position:relative;width:100%;height:16px;display:block}
.rule::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed var(--line)}
.rule svg{position:absolute;left:50%;top:0;width:16px;height:16px;transform:translateX(-50%) rotate(90deg);fill:var(--sun);background:var(--panel)}
.meta{font-family:var(--head);font-size:.9rem;margin:.6rem 0 0;padding-top:.55rem;border-top:1px dashed var(--line)}
.drive{font-family:var(--head);font-size:.95rem;color:var(--muted);margin:0 0 1.25rem}
.facts{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;font-family:var(--head);font-size:.95rem;margin:0 0 1.5rem;padding:0;list-style:none}
.facts b{font-weight:700}

.mapframe{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--ocean);height:clamp(320px,55vh,560px)}
.mapframe iframe{width:100%;height:100%;border:0;display:block}
.day{padding:1.75rem 0;border-top:1px solid var(--line);scroll-margin-top:1rem}
.day:first-child{border-top:0;padding-top:0}
.day h2{font-family:var(--head);font-weight:700;font-size:1.7rem;line-height:1.1;margin:0 0 .2rem;letter-spacing:-.01em}
.day .when{font-family:var(--head);color:var(--gum);font-size:.95rem;margin:0 0 1rem}
.day .when span{color:var(--muted)}
.go{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--head);font-weight:700;font-size:.95rem;background:var(--ink);color:var(--bg);text-decoration:none;padding:.55rem 1rem;border-radius:10px;margin:0 0 1rem}
.go svg{width:16px;height:16px;fill:currentColor}
.go:hover{opacity:.9}
ol.stops{list-style:none;margin:0;padding:0}
ol.stops li{display:grid;grid-template-columns:5.5rem 1fr;gap:.25rem 1rem;padding:.55rem 0}
.t{font-family:var(--head);font-size:.95rem;color:var(--muted);padding-top:.15rem;font-variant-numeric:tabular-nums}
.what{margin:0}
.what strong{font-weight:500}
.what .note{display:block;color:var(--muted);font-size:1rem}
.what a{font-family:var(--head);font-size:.85rem;color:var(--gum);text-underline-offset:3px}
.cook{border-left:3px solid var(--sun);padding-left:.75rem}

.changed{margin-top:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;font-size:1rem}
.changed p{margin:.25rem 0}
.changed h3{font-family:var(--head);font-size:1rem;margin:0 0 .25rem}

@media (prefers-reduced-motion:no-preference){
  .map .route.on{transition:stroke .25s}
}
</style>
</head>
<body>
<main class="page">
  <header class="top"><h1>Perth to Margaret River, six days</h1></header>
  <nav class="tabs" id="daypick" aria-label="Choose a day"></nav>
  <div class="layout">
    <div class="mapcol">
    <div class="mapframe"><iframe id="map" title="Google Map of the route" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    </div>
    <div class="panel">
    <div class="flights">
      <article class="flight" data-day="0">
        <p class="leg"><b>Flying in</b> Saturday</p>
        <div class="route">
          <div class="end"><span class="code">SIN</span><span class="tm">12:00 pm</span><span class="ap">Changi</span></div>
          <div class="path"><span class="dur">5 hr 10 min</span><span class="rule"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span><span class="dur">Nonstop</span></div>
          <div class="end r"><span class="code">PER</span><span class="tm">5:10 pm</span><span class="ap">Perth Airport</span></div>
        </div>
        <p class="meta">Scoot TR 8</p>
      </article>
      <article class="flight" data-day="6">
        <p class="leg"><b>Flying home</b> Friday</p>
        <div class="route">
          <div class="end"><span class="code">PER</span><span class="tm">6:30 pm</span><span class="ap">Perth Airport</span></div>
          <div class="path"><span class="dur">&nbsp;</span><span class="rule"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span><span class="dur">Nonstop</span></div>
          <div class="end r"><span class="code">SIN</span><span class="tm tbc">To confirm</span><span class="ap">Changi</span></div>
        </div>
        <p class="meta">Scoot, flight number to confirm</p>
      </article>
    </div>
    <p class="drive" data-day="-1">About 700 km of driving, all in one rental car.</p>
      <section id="days"></section>
    </div>
  </div>
</main>

<script>
const days = [
  { title:"Arrive and Fremantle", route:["Perth Airport","Little Creatures Brewery Fremantle"], day:"Saturday", base:"Fremantle", stops:[
    ["12:00 pm","Fly Scoot TR 8 from Changi"],
    ["5:10 pm","Land at Perth Airport, pick up the car","perth-airport"],
    ["6:00 pm","Drive 30 minutes to Fremantle and check in","fremantle"],
    ["7:30 pm","Dinner at Little Creatures on the harbour","little-creatures"]
  ]},
  { title:"Rottnest Island, then the markets", day:"Sunday", base:"Fremantle", stops:[
    ["8:00 am","Ferry from B-Shed, about 30 minutes","b-shed","Check your ticket: some sailings have been leaving from Northport instead."],
    ["9:00 am","E-bikes around the island and quokka spotting","rottnest","Pedal & Flipper hire is by the jetty. Lock the bikes whenever you stop."],
    ["12:30 pm","Lunch at Hotel Rottnest on the bay","hotel-rottnest","Keep an eye on your plate; the seagulls are bold."],
    ["3:30 pm","Ferry back to Fremantle","b-shed"],
    ["4:15 pm","Gift shopping at Fremantle Markets","freo-markets","Open until 6 pm, Friday to Sunday only."],
    ["7:00 pm","Dinner in Fremantle town","fremantle"]
  ]},
  { title:"South to Margaret River", route:["Fremantle WA","Bunbury Farmers Market","Busselton Jetty","Margaret River WA"], day:"Monday", base:"Margaret River", stops:[
    ["9:00 am","Check out and drive two hours south","fremantle"],
    ["11:00 am","Big grocery run at Bunbury Farmers Market","bunbury","Open daily. Meat, cheese, bread and produce all under one roof."],
    ["1:00 pm","Walk Busselton Jetty","busselton"],
    ["3:30 pm","Check in to the cabin","margaret-river"],
    ["6:30 pm","Cooking night 1","margaret-river",null,true]
  ]},
  { title:"Karri forest and caves", route:["Margaret River WA","Boranup Forest","Lake Cave Margaret River","Margaret River WA"], day:"Tuesday", base:"Margaret River", stops:[
    ["9:30 am","Slow drive through Boranup Forest on Caves Road","boranup"],
    ["11:00 am","Lake Cave","lake-cave","Around 350 steps down and back up."],
    ["2:00 pm","Butcher and fish shop run in town","margaret-river"],
    ["6:30 pm","Cooking night 2","margaret-river",null,true]
  ]},
  { title:"Wine, cheese and sunset", route:["Margaret River WA","Vasse Felix","Charcuterie Margaret River","Surfers Point Prevelly","Margaret River WA"], day:"Wednesday", base:"Margaret River", stops:[
    ["10:30 am","Tasting at Vasse Felix or Voyager Estate","vasse-felix"],
    ["1:30 pm","Cheese and cured meats at Charcuterie Margaret River","charcuterie","On Bussell Highway in town, with tastings."],
    ["4:30 pm","Sunset platter on the lawn at Surfers Point","surfers-point"],
    ["7:00 pm","Cooking night 3","margaret-river",null,true]
  ]},
  { title:"Beach, then back to Perth", route:["Margaret River WA","Meelup Beach","Elizabeth Quay Perth"], day:"Thursday", base:"Perth CBD", stops:[
    ["9:30 am","Swim or stroll at Meelup Beach","meelup","Calm, shallow water."],
    ["11:30 am","Drive about three hours north to Perth","perth-cbd"],
    ["3:00 pm","Check in and wander Elizabeth Quay","perth-cbd"],
    ["7:30 pm","Last-night dinner in the city","perth-cbd"]
  ]},
  { title:"Kings Park and home", route:["Elizabeth Quay Perth","Lotterywest Federation Walkway Kings Park","Perth Airport"], day:"Friday", base:null, stops:[
    ["10:00 am","Late check-out and a long brunch in the city","perth-cbd"],
    ["12:30 pm","Treetop walkway in Kings Park","kings-park","Free, with views over the river and city."],
    ["3:30 pm","Return the car and check in","perth-airport"],
    ["6:30 pm","Fly home to Singapore"]
  ]}
];

const places = {
  "perth-airport":{name:"Perth Airport",lat:-31.9385,lng:115.9672},
  "perth-cbd":{name:"Perth CBD",q:"Elizabeth Quay Perth",lat:-31.9576,lng:115.857},
  "kings-park":{name:"Kings Park",q:"Lotterywest Federation Walkway Kings Park",lat:-31.9646,lng:115.8394,hide:true},
  "fremantle":{name:"Fremantle",q:"Fremantle WA",lat:-32.056,lng:115.747},
  "little-creatures":{name:"Little Creatures",q:"Little Creatures Brewery Fremantle",lat:-32.0593,lng:115.7444,hide:true},
  "b-shed":{name:"B-Shed ferry",q:"Rottnest Express B Shed Ferry Terminal",lat:-32.0526,lng:115.7431,hide:true},
  "freo-markets":{name:"Fremantle Markets",q:"Fremantle Markets",lat:-32.0563,lng:115.7489,hide:true},
  "rottnest":{name:"Rottnest",q:"Rottnest Island Pedal and Flipper Hire",lat:-31.9984,lng:115.5416},
  "hotel-rottnest":{name:"Hotel Rottnest",q:"Hotel Rottnest",lat:-31.9984,lng:115.5424,hide:true},
  "bunbury":{name:"Bunbury market",q:"Bunbury Farmers Market",lat:-33.3365,lng:115.6804},
  "busselton":{name:"Busselton Jetty",q:"Busselton Jetty",lat:-33.6445,lng:115.345},
  "meelup":{name:"Meelup Beach",q:"Meelup Beach",lat:-33.5732,lng:115.0871},
  "vasse-felix":{name:"Vasse Felix",q:"Vasse Felix",lat:-33.8237,lng:115.048},
  "margaret-river":{name:"Margaret River",q:"Margaret River WA",lat:-33.9535,lng:115.063},
  "charcuterie":{name:"Charcuterie",q:"Charcuterie Margaret River",lat:-33.9492,lng:115.0744,hide:true},
  "surfers-point":{name:"Surfers Point",q:"Surfers Point Prevelly",lat:-33.9765,lng:114.9867},
  "lake-cave":{name:"Lake Cave",q:"Lake Cave Margaret River",lat:-34.079,lng:115.0293},
  "boranup":{name:"Boranup Forest",q:"Boranup Forest",lat:-34.1295,lng:115.0763},
  "via-busselton":{lat:-33.66,lng:115.4,via:true},
  "via-bunbury":{lat:-33.33,lng:115.67,via:true}
};

/* Optional: paste a Google Maps Embed API key here for the official embed.
   Leave empty to use the keyless embed. */
const API_KEY = "";
const E=encodeURIComponent;
const wholeTrip=["Perth Airport","Fremantle WA","Bunbury Farmers Market","Busselton Jetty","Margaret River WA","Meelup Beach","Elizabeth Quay Perth"];
function embedUrl(i){
  const r = i===-1 ? wholeTrip : days[i].route;
  if(!r){ // ferry day: show the island
    return API_KEY ? `https://www.google.com/maps/embed/v1/place?key=${API_KEY}&q=${E("Rottnest Island")}`
                   : keyless(i);
  }
  if(API_KEY){
    let u=`https://www.google.com/maps/embed/v1/directions?key=${API_KEY}&mode=driving&origin=${E(r[0])}&destination=${E(r[r.length-1])}`;
    if(r.length>2) u+='&waypoints='+r.slice(1,-1).map(E).join('|');
    return u;
  }
  return keyless(i);
}
/* Without a key Google won't draw routes, so frame each day's area instead */
const views={"-1":[-32.95,115.45,8],0:[-31.98,115.86,10],1:[-32.02,115.62,11],2:[-33.2,115.5,8],3:[-34.03,115.06,11],4:[-33.9,115.03,11],5:[-32.8,115.5,8],6:[-31.955,115.9,11]};
function keyless(i){const [la,ln,z]=views[i];return `https://maps.google.com/maps?ll=${la},${ln}&z=${z}&t=m&output=embed`}
const frame=document.getElementById('map');
let current=null, timer=null;
function highlight(i, now){
  document.querySelectorAll('#daypick button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i+1));
  if(i===current) return;
  current=i; clearTimeout(timer);
  timer=setTimeout(()=>{frame.src=embedUrl(i)}, now?0:450);
}

const pick=document.getElementById('daypick');
const allBtn=document.createElement('button'); allBtn.textContent='Whole trip';
allBtn.onclick=()=>select(-1); pick.append(allBtn);
days.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.day.slice(0,3);
  b.onclick=()=>select(i); pick.append(b)});
const mapsLink=id=>{const p=places[id];return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q||p.name)};
const routeLink=r=>{const e=encodeURIComponent;let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+e(r[0])+'&destination='+e(r[r.length-1]);if(r.length>2)u+='&waypoints='+r.slice(1,-1).map(e).join('%7C');return u};
const box=document.getElementById('days');
days.forEach((d,i)=>{
  const s=document.createElement('article'); s.className='day'; s.id='day'+i;
  s.innerHTML=`<h2>${d.title}</h2><p class="when">${d.day}${d.base?` <span>/ sleep in ${d.base}</span>`:''}</p>`;
  if(d.route) s.insertAdjacentHTML('beforeend',`<a class="go" href="${routeLink(d.route)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3 10.5l7 2.5 2.5 7z"/></svg>Open route in Google Maps</a>`);
  const ol=document.createElement('ol'); ol.className='stops';
  d.stops.forEach(([t,what,id,note,cook])=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="t">${t}</span><p class="what${cook?' cook':''}"><strong>${what}</strong>${note?`<span class="note">${note}</span>`:''}${id&&!cook?` <a href="${mapsLink(id)}" target="_blank" rel="noopener">Open in Maps</a>`:''}</p>`;
    ol.append(li);
  });
  s.append(ol);
  if(i===1){
    s.insertAdjacentHTML('beforeend',`<div class="changed"><h3>Why the markets moved to Sunday</h3><p>Fremantle Markets only opens Friday to Sunday, so the Thursday evening visit wouldn't have worked. Catching an earlier ferry back leaves time to shop before the 6 pm close.</p></div>`);
  }
  box.append(s);
});

function select(i){
  highlight(i,true);
  document.querySelectorAll('.day').forEach((el,j)=>el.hidden = !(i===-1 || j===i));
  document.getElementById('days').classList.toggle('single', i!==-1);
  document.querySelectorAll('[data-day]').forEach(el=>{const d=+el.dataset.day; el.hidden = d===-1 ? i!==-1 : !(i===-1 || d===i)});
  const fl=document.querySelector('.flights'); fl.hidden=[...fl.children].every(c=>c.hidden);
}
select(0);
</script>
</body>
</html>
